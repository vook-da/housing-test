<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B5C4B">
  <meta name="description" content="나에게 맞는 집은 어떤 집일까? 48문항으로 살펴보는 주거 라이프스타일 테스트">
  <title>나에게 맞는 집은 어떤 집일까? | 주거 라이프스타일 테스트</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- Pretendard를 못 받는 환경에서만 쓰이는 대체 폰트 -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <style>
  /* ============================================================
     디자인 토큰 — 건축 제도용지 컨셉
     직각 모서리, 얇은 선, 단일 강조색(딥그린)
     ============================================================ */
  :root{
    --paper:#F4F2ED;
    --card:#FFFFFF;
    --ink:#16161A;
    --ink-2:#46443F;
    --ink-3:#8B867C;
    --line:#E3DED4;
    --line-2:#CFC8BA;
    --accent:#1B5C4B;
    --accent-dark:#113D32;
    --accent-soft:#EBF2EF;
    --accent-line:#AFCCC2;
    --signal:#B4522B;
    --r:3px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    /* Pretendard 우선, 실패 시 Noto Sans KR → 시스템 한글 폰트 순 */
    background:var(--paper);
    color:var(--ink);
    line-height:1.68;
    font-size:16px;
    letter-spacing:-.011em;
    -webkit-font-smoothing:antialiased;
  }
  /* 종이 위의 아주 옅은 모눈 — 도면 느낌의 바탕 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    opacity:.5;
    mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 10%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 10%,transparent 75%);
  }
  a{color:inherit}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  h1,h2,h3,p{margin:0 0 14px}
  h1{font-size:clamp(33px,6.6vw,54px);line-height:1.17;letter-spacing:-.045em;font-weight:800}
  h2{font-size:clamp(22px,4vw,27px);line-height:1.3;letter-spacing:-.035em;font-weight:800}
  h3{font-size:17px;letter-spacing:-.025em;font-weight:750;margin-bottom:10px}
  strong,b{font-weight:750}

  /* ── 공통 유틸 ── */
  .eyebrow{
    font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--accent);
    display:flex;align-items:center;gap:9px;margin-bottom:14px;text-transform:uppercase;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--accent-line)}
  .lead{font-size:17.5px;color:var(--ink-2);line-height:1.7}
  .small{font-size:14px;color:var(--ink-3);line-height:1.65}
  .micro{font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .num{font-variant-numeric:tabular-nums}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ── 진행 바 (상단 고정) ── */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:60;
    background:transparent;
  }
  .topbar>i{
    display:block;height:100%;width:0;background:var(--accent);
    transition:width .45s var(--ease);
  }

  /* ── 헤더 ── */
  .site-head{
    position:relative;z-index:1;
    border-bottom:1px solid var(--line);
    background:rgba(244,242,237,.82);
    backdrop-filter:saturate(1.6) blur(8px);
    -webkit-backdrop-filter:saturate(1.6) blur(8px);
    position:sticky;top:0;z-index:50;
  }
  .site-head .inner{
    max-width:860px;margin:0 auto;padding:13px 22px;
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  }
  .logo{font-size:13px;font-weight:800;letter-spacing:-.02em}
  .logo em{font-style:normal;color:var(--accent)}
  .head-note{font-size:11.5px;color:var(--ink-3);letter-spacing:.01em}

  main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:44px 22px 90px}

  /* ── 카드(직각 + 얇은 선) ── */
  .sheet{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:clamp(24px,4.6vw,38px);
  }
  .sheet + .sheet{margin-top:18px}

  /* ── 히어로 ── */
  .hero{
    position:relative;background:var(--card);
    border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:var(--r);
    padding:clamp(30px,6vw,52px);
    overflow:hidden;
  }
  /* 도면의 지붕선 — 장식이 아니라 주제를 가리키는 표식 */
  .hero svg.roof{
    position:absolute;right:-30px;top:26px;width:270px;height:200px;
    stroke:var(--accent-line);fill:none;stroke-width:1.1;opacity:.75;pointer-events:none;
  }
  .hero h1{max-width:12ch}
  .hero .lead{max-width:50ch}
  .hero-meta{
    display:flex;flex-wrap:wrap;gap:0 26px;margin-top:26px;padding-top:20px;
    border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);
  }
  .hero-meta span{display:flex;align-items:baseline;gap:6px}
  .hero-meta b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}

  /* ── 파트 목록(카드 대신 치수선 리스트) ── */
  .parts{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .parts li{
    display:grid;grid-template-columns:64px 1fr;gap:18px;
    padding:17px 0;border-bottom:1px solid var(--line);align-items:start;
  }
  .parts .no{
    font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--accent);
    padding-top:3px;font-variant-numeric:tabular-nums;
  }
  .parts h3{margin:0 0 3px}
  .parts p{margin:0;font-size:14px;color:var(--ink-3);line-height:1.6}

  /* ── 폼 요소 ── */
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px;color:var(--ink-2)}
  .field select{
    width:100%;padding:13px 12px;min-height:50px;
    border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
    font-size:15px;transition:border-color .18s;
  }
  .field select:hover{border-color:var(--ink-3)}

  .consent{
    display:flex;gap:11px;align-items:flex-start;
    margin-top:18px;padding:15px;
    background:var(--accent-soft);border-left:2px solid var(--accent);
    font-size:13.5px;line-height:1.62;
  }
  .consent input{margin:4px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto}

  /* ── 버튼 ── */
  .btn{
    border:1px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:var(--r);padding:14px 26px;min-height:50px;
    font-weight:750;font-size:15px;letter-spacing:-.01em;
    transition:background .18s,border-color .18s,transform .12s var(--ease),opacity .18s;
  }
  .btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{background:#CFCBC3;border-color:#CFCBC3;color:#fff;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
  .btn-ghost:hover{background:#F0EDE6;color:var(--ink);border-color:var(--ink-3)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  .btn-row .btn{flex:1;min-width:140px}

  .note{
    margin-top:20px;padding:14px 16px;
    background:#F7F5F0;border:1px solid var(--line);border-radius:var(--r);
    font-size:13px;color:var(--ink-2);line-height:1.65;
  }
  .note strong{color:var(--ink)}

  /* ============================================================
     문항 화면
     ============================================================ */
  .part-head{margin-bottom:26px}
  .part-head .row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .part-head h1{font-size:clamp(26px,4.6vw,36px);margin-bottom:8px}

  .gauge{margin-top:22px}
  .gauge-row{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:12.5px;color:var(--ink-3);margin-bottom:8px;
  }
  .gauge-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800;font-size:13px}
  .ticks{display:flex;gap:4px}
  .ticks i{
    flex:1;height:4px;background:var(--line);border-radius:1px;
    transition:background .35s var(--ease);
  }
  .ticks i.active{background:var(--accent-line)}
  .ticks i.done{background:var(--accent)}

  /* ── 질문 ── */
  .q{
    padding:26px 0;border-bottom:1px solid var(--line);
  }
  .q:last-of-type{border-bottom:0;padding-bottom:6px}
  .q-text{
    display:grid;grid-template-columns:40px 1fr;gap:12px;
    margin-bottom:17px;font-size:16.5px;font-weight:650;line-height:1.6;letter-spacing:-.02em;
  }
  .q-no{
    font-size:11.5px;font-weight:800;color:var(--ink-3);
    font-variant-numeric:tabular-nums;padding-top:5px;letter-spacing:.04em;
    transition:color .25s;
  }
  .q.answered .q-no{color:var(--accent)}

  /* 5점 척도 — 점과 트랙 */
  .scale{position:relative;padding:0 2px}
  .scale-track{
    position:absolute;left:10%;right:10%;top:15px;height:1px;background:var(--line-2);
  }
  .scale-opts{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
  .opt{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:2px 0 4px;cursor:pointer;
  }
  .opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .dot{
    width:27px;height:27px;border-radius:50%;
    border:1.5px solid var(--line-2);background:var(--card);
    display:grid;place-items:center;
    transition:border-color .18s,background .18s,transform .18s var(--ease);
  }
  .dot::after{
    content:"";width:11px;height:11px;border-radius:50%;background:var(--accent);
    transform:scale(0);transition:transform .22s var(--ease);
  }
  .opt-label{
    font-size:12px;color:var(--ink-3);text-align:center;line-height:1.3;
    letter-spacing:-.03em;transition:color .18s,font-weight .18s;
  }
  .opt:hover .dot{border-color:var(--accent);transform:scale(1.07)}
  .opt input:checked + .dot{border-color:var(--accent);border-width:2px}
  .opt input:checked + .dot::after{transform:scale(1)}
  .opt input:checked ~ .opt-label{color:var(--accent);font-weight:800}
  .opt input:focus-visible + .dot{outline:2px solid var(--accent);outline-offset:3px}

  /* ============================================================
     결과 화면
     ============================================================ */
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
  .bar-item{padding:13px 0;border-bottom:1px solid var(--line)}
  .bar-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
  .bar-head strong{font-size:14px;font-weight:700;letter-spacing:-.02em}
  .bar-head span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:750}
  .bar{height:6px;background:#EEEAE2;border-radius:1px;overflow:hidden}
  .bar>i{
    display:block;height:100%;width:0;background:var(--accent);border-radius:1px;
    transition:width .9s var(--ease);
  }

  .result{
    border:1px solid var(--line);border-radius:var(--r);
    padding:22px;margin-top:14px;background:var(--card);
  }
  .result.top{border:1px solid var(--accent);border-top:3px solid var(--accent);padding-top:21px}
  .result .rank{
    font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--accent);
    margin-bottom:9px;display:block;
  }
  .result h3{font-size:20px;margin-bottom:7px;letter-spacing:-.03em}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
  .tag{
    font-size:11.5px;color:var(--accent);background:var(--accent-soft);
    border:1px solid var(--accent-line);border-radius:100px;padding:3px 10px;font-weight:650;
  }
  .check{
    margin-top:14px;padding:13px 15px;background:#F7F5F0;
    border-left:2px solid var(--line-2);font-size:13.5px;line-height:1.62;
  }
  .check strong{display:block;margin-bottom:3px;font-size:12px;letter-spacing:.02em;color:var(--ink-3)}
  .chapter-ref{
    margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--accent);font-weight:650;letter-spacing:-.02em;
  }

  .balance{
    padding:15px 17px;margin-top:12px;
    background:var(--accent-soft);border-left:2px solid var(--accent);
    font-size:14px;line-height:1.68;
  }

  hr.rule{border:0;border-top:1px solid var(--line);margin:26px 0}

  /* ── 도서 소개 ── */
  .book{
    display:grid;grid-template-columns:132px 1fr;gap:26px;align-items:start;
  }
  .book-cover{
    position:relative;width:132px;aspect-ratio:3/4.3;
    background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:2px;
    overflow:hidden;display:grid;place-items:center;
    box-shadow:0 10px 26px rgba(27,92,75,.14);
  }
  .book-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .book-cover .ph{
    padding:14px;text-align:center;font-size:11.5px;color:var(--accent);
    line-height:1.55;font-weight:700;letter-spacing:-.02em;
  }
  .book h3{font-size:21px;margin-bottom:4px;letter-spacing:-.035em}
  .book .book-sub{font-size:13.5px;color:var(--accent);font-weight:650;margin-bottom:6px;letter-spacing:-.025em}
  .book .byline{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
  .endorse{
    margin:14px 0 0;padding:13px 16px;
    background:var(--accent-soft);border-left:2px solid var(--accent);
    font-size:13.5px;line-height:1.65;color:var(--ink-2);
  }
  .endorse cite{display:block;margin-top:7px;font-style:normal;font-size:12px;color:var(--ink-3)}
  /* 서점 버튼 — 평소엔 모노톤, 올리면 원래 색 */
  .stores{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .store{
    flex:1;min-width:96px;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    border:1px solid var(--line-2);border-radius:var(--r);
    padding:13px 10px;min-height:48px;background:var(--card);
    transition:border-color .2s,background .2s,transform .15s var(--ease);
  }
  .store img{
    height:19px;width:auto;display:block;
    filter:grayscale(100%) opacity(.52);
    transition:filter .2s;
  }
  .store:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .store:hover img{filter:none}
  /* 링크가 아직 없을 때 */
  .store.soon{cursor:default;background:#F7F5F0;border-style:dashed}
  .store.soon:hover{border-color:var(--line-2);background:#F7F5F0;transform:none}
  .store.soon img{filter:grayscale(100%) opacity(.3)}
  .store.soon:hover img{filter:grayscale(100%) opacity(.3)}
  .stores-note{font-size:12px;color:var(--ink-3);margin:10px 0 0;text-align:center}

  /* ── 통계 ── */
  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
  .tab{
    border:1px solid var(--line-2);background:var(--card);border-radius:100px;
    padding:9px 15px;font-size:13px;font-weight:700;color:var(--ink-2);
    transition:all .18s;
  }
  .tab:hover{border-color:var(--accent);color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .dist{
    display:grid;grid-template-columns:minmax(118px,1.25fr) minmax(80px,2.2fr) 74px;
    align-items:center;gap:11px;padding:7px 0;
  }
  .dist-name{font-size:12.5px;line-height:1.35;letter-spacing:-.025em}
  .dist-track{height:9px;background:#EEEAE2;border-radius:1px;overflow:hidden}
  .dist-track>i{display:block;height:100%;width:0;background:var(--accent-line);transition:width .7s var(--ease)}
  .dist.me .dist-track>i{background:var(--accent)}
  .dist.me .dist-name{font-weight:800;color:var(--accent)}
  .dist-val{font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .cohorts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .cohort{border:1px solid var(--line);border-radius:var(--r);padding:15px}
  .cohort h3{font-size:14px;margin-bottom:10px}
  .cohort-item{padding:9px 0;border-top:1px solid var(--line)}
  .cohort-item:first-of-type{border-top:0}
  .cohort-item strong{display:block;font-size:13px;font-weight:700}
  .cohort-item span{font-size:12px;color:var(--ink-3)}
  .mini{
    background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.6;margin:12px 0;
  }
  .demo-flag{
    display:inline-block;border:1px solid var(--signal);color:var(--signal);
    border-radius:2px;font-size:11px;font-weight:800;padding:3px 7px;letter-spacing:.02em;
  }

  .foot{font-size:12px;color:var(--ink-3);line-height:1.68;margin-top:36px}

  /* ── 다이얼로그 / 토스트 (네이티브 팝업 대체) ── */
  .modal{
    position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
    background:rgba(22,22,26,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
  }
  .modal.on{opacity:1;pointer-events:auto}
  .modal-box{
    background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:var(--r);padding:26px;width:100%;max-width:420px;
    transform:translateY(10px) scale(.99);transition:transform .26s var(--ease);
  }
  .modal.on .modal-box{transform:none}
  .modal-box h3{margin-bottom:8px;font-size:18px}
  .modal-box p{font-size:14px;color:var(--ink-2);margin-bottom:0;line-height:1.65}
  .modal-box textarea{
    width:100%;margin-top:14px;min-height:148px;padding:12px;
    border:1px solid var(--line-2);border-radius:var(--r);
    font-size:13px;line-height:1.6;resize:vertical;background:var(--paper);
    font-family:inherit;
  }
  .modal-actions{display:flex;gap:9px;margin-top:20px;justify-content:flex-end}
  .modal-actions .btn{min-height:44px;padding:11px 20px;font-size:14px;flex:0 0 auto}

  .toast{
    position:fixed;left:50%;bottom:30px;z-index:210;
    transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;border-radius:var(--r);
    padding:13px 22px;font-size:14px;font-weight:650;letter-spacing:-.01em;
    box-shadow:0 10px 30px rgba(22,22,26,.3);
    transition:opacity .26s var(--ease),transform .26s var(--ease);
    max-width:calc(100vw - 40px);text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ============================================================
     도서 배너
     - 문항 화면에서만, 몇 초 뒤에 등장
     - 닫으면 24시간 동안 다시 뜨지 않음
     - 넓은 화면은 우측 여백, 좁은 화면은 하단 바
     ============================================================ */
  .promo{
    position:fixed;z-index:120;
    opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease),transform .45s var(--ease);
  }
  .promo.on{opacity:1;pointer-events:auto}
  .promo-close{
    position:absolute;border:0;background:transparent;
    color:var(--ink-3);cursor:pointer;line-height:1;
    display:grid;place-items:center;border-radius:2px;
    transition:color .18s,background .18s;
  }
  .promo-close:hover{color:var(--ink);background:#EFEBE4}
  .promo a{text-decoration:none;display:block}
  .promo-cover{
    background:var(--accent-soft);border:1px solid var(--accent-line);
    overflow:hidden;flex:0 0 auto;
  }
  .promo-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .promo-copy{
    font-weight:700;letter-spacing:-.025em;color:var(--ink);
    transition:opacity .3s var(--ease);
  }
  .promo-copy.fade{opacity:0}
  .promo-cta{
    background:var(--accent);color:#fff;text-align:center;font-weight:750;
    border-radius:var(--r);letter-spacing:-.01em;
    transition:background .18s;
  }
  .promo:hover .promo-cta{background:var(--accent-dark)}

  /* ── 넓은 화면: 우측 여백 세로 배너 ── */
  @media(min-width:1300px){
    .promo{
      right:max(24px,calc((100vw - 860px)/2 - 252px));
      top:50%;transform:translateY(-44%);
      width:228px;
      background:var(--card);
      border:1px solid var(--line);border-top:3px solid var(--accent);
      border-radius:var(--r);
      padding:18px 16px 16px;
      box-shadow:0 14px 40px rgba(75,60,40,.11);
    }
    .promo.on{transform:translateY(-50%)}
    .promo-close{top:7px;right:7px;width:26px;height:26px;font-size:15px}
    .promo-label{
      font-size:10.5px;font-weight:800;letter-spacing:.13em;
      color:var(--accent);margin-bottom:12px;
    }
    .promo-cover{width:92px;aspect-ratio:3/4.29;border-radius:2px;margin:0 auto 14px;
                 box-shadow:0 6px 16px rgba(27,92,75,.16)}
    .promo-copy{font-size:13.5px;line-height:1.55;margin-bottom:6px;min-height:63px}
    .promo-book{font-size:11.5px;color:var(--ink-3);margin-bottom:13px;line-height:1.45}
    .promo-cta{display:block;padding:10px;font-size:13px}
    .promo-bar-only{display:none}
  }

  /* ── 좁은 화면: 하단 가로 바 ── */
  @media(max-width:1299px){
    .promo{
      left:0;right:0;bottom:0;
      transform:translateY(100%);
      background:var(--card);
      border-top:1px solid var(--line);
      box-shadow:0 -6px 24px rgba(75,60,40,.1);
      padding:11px 44px 11px 14px;
      padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
    }
    .promo.on{transform:translateY(0)}
    .promo-inner{
      max-width:620px;margin:0 auto;
      display:flex;align-items:center;gap:12px;
    }
    .promo-close{top:50%;margin-top:-15px;right:9px;width:30px;height:30px;font-size:17px}
    .promo-label{display:none}
    .promo-cover{width:40px;aspect-ratio:3/4.29;border-radius:2px}
    .promo-text{flex:1;min-width:0}
    .promo-copy{
      font-size:13px;line-height:1.4;margin-bottom:2px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .promo-book{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .promo-cover-link{flex:0 0 auto}
    .promo-cta{flex:0 0 auto;padding:9px 14px;font-size:12.5px;align-self:center}
  }
  /* 출간 전이라 서점 링크가 아직 없을 때 */
  .promo-cta.pending{
    background:transparent;color:var(--accent);
    border:1px solid var(--accent-line);cursor:default;
  }
  .promo:hover .promo-cta.pending{background:transparent}
  @media(max-width:380px){
    .promo-cover{display:none}
    .promo-cta{padding:9px 11px;font-size:12px}
  }

  /* ============================================================
     결과 분석 중 화면
     ============================================================ */
  .analyzing{
    min-height:calc(100vh - 220px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;
  }
  .analyzing-status{
    font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent);
    margin-bottom:28px;
  }
  .analyzing-status::after{
    content:"";display:inline-block;width:1.2em;text-align:left;
    animation:dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  .analyzing-cover{
    width:148px;aspect-ratio:3/4.29;margin-bottom:26px;
    border:1px solid var(--accent-line);border-radius:2px;overflow:hidden;
    background:var(--accent-soft);
    box-shadow:0 16px 42px rgba(27,92,75,.2);
    animation:coverRise .9s var(--ease) both;
  }
  .analyzing-cover img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes coverRise{
    from{opacity:0;transform:translateY(18px) scale(.96)}
    to{opacity:1;transform:none}
  }

  .analyzing-quote{
    font-size:clamp(18px,3.4vw,23px);font-weight:800;letter-spacing:-.035em;
    line-height:1.5;color:var(--ink);max-width:19ch;margin:0 auto 12px;
    min-height:2.1em;
    animation:fadeUp .7s var(--ease) .25s both;
  }
  .analyzing-book{
    font-size:13px;color:var(--ink-3);margin-bottom:34px;
    animation:fadeUp .7s var(--ease) .4s both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .analyzing-bar{
    width:min(260px,70vw);height:3px;background:var(--line);
    border-radius:2px;overflow:hidden;
  }
  .analyzing-bar>i{
    display:block;height:100%;width:0;background:var(--accent);
    animation:fill var(--dur,2800ms) cubic-bezier(.35,.1,.25,1) forwards;
  }
  @keyframes fill{from{width:0}to{width:100%}}

  @media(prefers-reduced-motion:reduce){
    .analyzing-cover,.analyzing-quote,.analyzing-book{animation:none}
    .analyzing-bar>i{animation:none;width:100%}
    .analyzing-status::after{animation:none;content:"..."}
  }

  /* ============================================================
     모션
     ============================================================ */
  .reveal{opacity:0;transform:translateY(15px)}
  .reveal.in{
    opacity:1;transform:none;
    transition:opacity .62s var(--ease),transform .62s var(--ease);
  }
  @keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .screen-in{animation:screenIn .42s var(--ease) both}

  /* ============================================================
     반응형
     ============================================================ */
  @media(max-width:640px){
    body{font-size:15.5px}
    main{padding:30px 15px 70px}
    .site-head .inner{padding:11px 15px}
    .head-note{display:none}
    .sheet,.hero{padding:22px 17px}
    .hero svg.roof{width:180px;right:-42px;top:18px;opacity:.5}
    .field-grid,.bars,.cohorts{grid-template-columns:1fr}
    .bars{gap:0}
    .parts li{grid-template-columns:52px 1fr;gap:12px}
    .hero-meta{gap:0 18px}
    .q-text{grid-template-columns:30px 1fr;gap:8px;font-size:15.5px}
    .scale-track{left:8%;right:8%;top:14px}
    .dot{width:25px;height:25px}
    .opt-label{font-size:11px;letter-spacing:-.05em}
    .book{grid-template-columns:104px 1fr;gap:16px}
    .book-cover{width:104px}
    .dist{grid-template-columns:minmax(96px,1.2fr) minmax(54px,1.3fr) 64px;gap:7px}
    .dist-name{font-size:11.5px}
    .btn-row .btn{min-width:120px}
    .pc-br{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .reveal{opacity:1;transform:none}
  }
  </style>
</head>

  /* ── 다이얼로그 / 토스트 ──

     일부 환경(인앱 브라우저, 임베드)에서 차단되므로 직접 만든다. */
  const modal=document.getElementById('modal');
  const toastEl=document.getElementById('toast');
  let lastFocus=null, toastTimer=null;

  function closeModal(){
    modal.classList.remove('on');
    setTimeout(()=>{modal.hidden=true},220);
    document.removeEventListener('keydown',onModalKey);
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  function onModalKey(e){ if(e.key==='Escape') closeModal(); }

  /* 확인 다이얼로그 — true/false 를 돌려준다 */
  function ask({title,desc,ok='확인',cancel='취소'}){
    return new Promise(resolve=>{
      lastFocus=document.activeElement;
      document.getElementById('modal-title').textContent=title;
      document.getElementById('modal-desc').textContent=desc||'';
      document.getElementById('modal-extra').innerHTML='';
      const acts=document.getElementById('modal-actions');
      acts.innerHTML=`<button class="btn btn-ghost" data-act="no">${esc(cancel)}</button>
                      <button class="btn" data-act="yes">${esc(ok)}</button>`;
      modal.hidden=false;
      requestAnimationFrame(()=>modal.classList.add('on'));
      document.addEventListener('keydown',onModalKey);
      acts.querySelector('[data-act="yes"]').focus();
      acts.onclick=e=>{
        const act=e.target.dataset.act; if(!act) return;
        closeModal(); resolve(act==='yes');
      };
      modal.onclick=e=>{ if(e.target===modal){ closeModal(); resolve(false); } };
    });
  }

  /* 복사 실패 시 직접 선택해 가져가도록 텍스트를 보여준다 */

  function promoRotate(){

  function promoShow(){
    if(promoMuted()) return;

  function promoHide(){
    clearTimeout(promoTimer);

  /* 스크롤 진입 시 순차 등장 */
  let observer=null;
  function observeReveals(scope){
    if(reduceMotion){ scope.querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); return; }
    if(observer) observer.disconnect();
    observer=new IntersectionObserver((entries,obs)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const el=entry.target;
        const delay=Number(el.dataset.delay||0);
        setTimeout(()=>el.classList.add('in'),delay);
        obs.unobserve(el);
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.08});
    scope.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
  }

  /* 화면 전환 공통 */
  function paint(html){
    root.innerHTML=html;
    root.classList.remove('screen-in');
    void root.offsetWidth;
    if(!reduceMotion) root.classList.add('screen-in');
    observeReveals(root);
  }

  /* 숫자 카운트업 */
  function countUp(el,to,ms){
    if(reduceMotion){ el.textContent=to; return; }
    const start=performance.now();
    const step=now=>{
      const t=Math.min(1,(now-start)/ms);
      el.textContent=Math.round(to*(1-Math.pow(1-t,3)));
      if(t<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function scores(){
    const acc={}; axesOrder.forEach(x=>acc[x]=[]);
    DATA.questions.forEach((q,i)=>{
      const raw=answers[i];
      if(raw!==null) acc[q.axis].push(q.reverse?6-raw:raw);
    });
    return Object.fromEntries(axesOrder.map(x=>{
      const arr=acc[x];
      const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
      return [x,Math.round((avg-1)*25)];
    }));
  }
  function profiles(s){
    return DATA.profiles.map(p=>{
      const distance=axesOrder.reduce((sum,x)=>sum+Math.abs(s[x]-p.target[x]),0)/axesOrder.length;
      return {...p,distance};
    }).sort((a,b)=>a.distance-b.distance);
  }

    const a=[];
    if(s.L>=70&&s.N>=70) a.push('<b>생활 접근성</b>과 <b>자연환경 선호</b>가 모두 높습니다. 외곽의 풍경보다 <strong>녹지가 가까운 실제 생활권</strong>을 우선 확인하세요.');

  /* ============================================================
     통계 (Supabase 선택 연동)
     ============================================================ */
  function demoStats(){
    const ids=DATA.profiles.map(p=>p.id);
    const ageNames=AGE_OPTIONS.slice(1), genderNames=['여성','남성','기타'];
    let rows=[],seq=0;
    for(let age=0;age<ageNames.length;age++) for(let gender=0;gender<genderNames.length;gender++){
      const n=gender===2?6:34;
      for(let i=0;i<n;i++){
        let idx=(i*3+age*2+gender+(i%7===0?4:0))%ids.length;
        if(i%4===0) idx=(age+gender)%ids.length;
        rows.push({age:ageNames[age],gender:genderNames[gender],type:ids[idx],seq:seq++});
      }
    }
    const group=(arr,scope,key)=>({scope,key,n:arr.length,
      counts:Object.fromEntries(ids.map(id=>[id,arr.filter(r=>r.type===id).length]))});
    const groups=[group(rows,'overall','전체')];
    ageNames.forEach(x=>{const a=rows.filter(y=>y.age===x);if(a.length>=20)groups.push(group(a,'age',x))});
    genderNames.forEach(x=>{const a=rows.filter(y=>y.gender===x);if(a.length>=20)groups.push(group(a,'gender',x))});
    return {total:rows.length,minimum_n:20,groups};
  }
  /* 연령대·성별을 Firestore 필드명으로 쓰기 위한 영문 키.
     한글/공백이 섞인 필드명은 경로 처리가 까다로워 코드로 변환한다. */
  const AGE_KEY={'20대 이하':'u20','30대':'s30','40대':'s40','50대':'s50','60대':'s60','70대 이상':'o70'};
  const GENDER_KEY={'여성':'f','남성':'m','기타':'x'};

  /* Firebase SDK는 실제로 필요한 순간에만 불러온다.
     불러오기에 실패해도 테스트 본체는 그대로 동작해야 하므로 예외를 삼킨다. */
  let fbCache=null;
  async function firebase(){
    if(fbCache!==null) return fbCache;
    try{
      const [appMod,fsMod]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js')
      ]);
      const app=appMod.initializeApp(FIREBASE_CONFIG);
      fbCache={
        db:fsMod.getFirestore(app),
        doc:fsMod.doc, getDoc:fsMod.getDoc, setDoc:fsMod.setDoc, increment:fsMod.increment
      };
    }catch(_e){ fbCache=false; }
    return fbCache;
  }

  /* Firestore 문서(누적 카운터)를 화면이 기대하는 형태로 변환 */
  function toStats(raw){
    const ids=DATA.profiles.map(p=>p.id);
    const norm=obj=>Object.fromEntries(ids.map(id=>[id,Math.max(0,Number(obj?.[id]||0))]));
    const sum=c=>Object.values(c).reduce((a,b)=>a+b,0);
    const groups=[];

    const overall=norm(raw.overall);
    const totalN=sum(overall);
    if(totalN>=MINIMUM_N) groups.push({scope:'overall',key:'전체',n:totalN,counts:overall});

    AGE_OPTIONS.slice(1).forEach(label=>{
      const c=norm(raw['age_'+AGE_KEY[label]]), n=sum(c);
      if(n>=MINIMUM_N) groups.push({scope:'age',key:label,n,counts:c});
    });
    GENDER_OPTIONS.slice(1).forEach(label=>{
      const c=norm(raw['gender_'+GENDER_KEY[label]]), n=sum(c);
      if(n>=MINIMUM_N) groups.push({scope:'gender',key:label,n,counts:c});
    });
    return {total:totalN,minimum_n:MINIMUM_N,groups};
  }

  /* 1순위 유형 1건을 누적 카운터에 더한다.
     개별 응답은 저장하지 않고 숫자만 올리므로 되돌아볼 기록이 남지 않는다. */
  async function postFirstChoice(typeId){
    if(!demographics.consent||!statsConfigured()) return '미참여';
    try{
      if(localStorage.getItem(submittedFlagKey)==='yes') return '이 브라우저에서는 이미 집계에 참여했습니다.';
    }catch(_e){}

    const fb=await firebase();
    if(!fb) throw new Error('통계 서버에 연결하지 못했습니다.');

    const bump={overall:{[typeId]:fb.increment(1)}};
    const ak=AGE_KEY[demographics.age];
    if(ak) bump['age_'+ak]={[typeId]:fb.increment(1)};
    const gk=GENDER_KEY[demographics.gender];
    if(gk) bump['gender_'+gk]={[typeId]:fb.increment(1)};

    await fb.setDoc(fb.doc(fb.db,...STATS_DOC),bump,{merge:true});
    try{ localStorage.setItem(submittedFlagKey,'yes'); }catch(_e){}
    return '집계에 참여했습니다. 감사합니다.';
  }

  async function getStats(){
    const fb=await firebase();
    if(!fb) throw new Error('통계 서버에 연결하지 못했습니다.');
    const snap=await fb.getDoc(fb.doc(fb.db,...STATS_DOC));
    return toStats(snap.exists()?snap.data():{});
  }
  const cohortRows=(arr,scope)=>arr.filter(x=>x.scope===scope).sort((a,b)=>
    scope==='age'?AGE_OPTIONS.indexOf(a.key)-AGE_OPTIONS.indexOf(b.key)
                 :GENDER_OPTIONS.indexOf(a.key)-GENDER_OPTIONS.indexOf(b.key));
  const winner=g=>{const t=Object.entries(g.counts||{}).sort((a,b)=>b[1]-a[1]);return t.length?t[0]:['',0]};

  function distributionBars(g,myType){
    const head=`<div class="mini"><strong>${esc(g.key)} 참여자 ${g.n.toLocaleString('ko-KR')}명</strong>의 대표 주거 유형 분포입니다.${
      myType&&g.counts&&g.counts[myType]!==undefined
        ? ` 내 1순위 유형을 선택한 참여자는 이 그룹의 ${Math.round(g.counts[myType]/g.n*100)}%입니다.` : ''}</div>`;
    const rows=DATA.profiles.map(p=>{
      const n=Math.max(0,Number(g.counts?.[p.id]||0));
      const pct=g.n?Math.round(n/g.n*100):0;
      return `<div class="dist ${p.id===myType?'me':''}">
        <div class="dist-name">${esc(p.name)}${p.id===myType?' <strong>· 나의 유형</strong>':''}</div>
        <div class="dist-track" role="img" aria-label="${esc(p.name)} ${pct}%"><i data-w="${pct}"></i></div>
        <div class="dist-val num">${pct}% · ${n}명</div>
      </div>`;
    }).join('');
    return head+rows;
  }
  function animateDist(scope){
    scope.querySelectorAll('.dist-track > i').forEach((el,i)=>{
      setTimeout(()=>{el.style.width=el.dataset.w+'%'},reduceMotion?0:40+i*40);
    });
  }
  function groupList(groups,scope){
    const rows=cohortRows(groups,scope);
    const names=scope==='age'?AGE_OPTIONS.slice(1):GENDER_OPTIONS.slice(1);
    return `<div class="cohort"><h3>${scope==='age'?'연령대별 가장 많은 유형':'성별 가장 많은 유형'}</h3>`+
      names.map(name=>{
        const g=rows.find(x=>x.key===name);
        if(!g) return `<div class="cohort-item"><strong>${esc(name)}</strong><span>표본 20명 미만 또는 응답 없음 · 비공개</span></div>`;
        const [id,count]=winner(g);
        return `<div class="cohort-item"><strong>${esc(name)} <span class="num">(n=${g.n})</span></strong><span>${esc(profileName(id))} · ${Math.round(count/g.n*100)}%</span></div>`;
      }).join('')+'</div>';
  }
  function displayStats(stats,myType,demo=false){
    const box=document.getElementById('stats-content'); if(!box) return;
    const groups=Array.isArray(stats.groups)?stats.groups:[];
    const overall=groups.find(x=>x.scope==='overall');
    if(!overall){
      box.innerHTML=`<div class="mini">아직 공개 가능한 참여자 수에 도달하지 않았습니다. 실제 통계는 전체 20명 이상부터 표시됩니다. 현재 집계 ${Number(stats.total||0)}명.</div>${
        !demo?'<button id="show-demo" class="btn btn-ghost">가상 데이터로 그래프 미리보기</button>':''}`;
      const b=document.getElementById('show-demo');
      if(b) b.onclick=()=>displayStats(demoStats(),myType,true);
      return;
    }
    const tabs=[{label:'전체 참여자',grp:overall}];
    if(demographics.age!=='응답하지 않음')
      tabs.push({label:`나와 같은 ${demographics.age}`,grp:groups.find(x=>x.scope==='age'&&x.key===demographics.age)});
    if(demographics.gender!=='응답하지 않음')
      tabs.push({label:`나와 같은 성별 (${demographics.gender})`,grp:groups.find(x=>x.scope==='gender'&&x.key===demographics.gender)});

    box.innerHTML=`${demo?'<p style="margin-bottom:12px"><span class="demo-flag">가상 데이터 · 실제 참여자 아님</span></p>':''}
      <div class="tabs" role="group" aria-label="비교할 집단 선택">
        ${tabs.map((t,i)=>`<button type="button" data-tab="${i}" class="tab ${i===0?'active':''}">${esc(t.label)}</button>`).join('')}
      </div>
      <div id="dist-box"></div>
      <div class="cohorts">${groupList(groups,'age')}${groupList(groups,'gender')}</div>
      <p class="micro" style="margin-top:16px">표시된 백분율은 해당 집단에서 각 유형이 1순위로 나온 비율입니다. 전체 인구를 대표하지 않으며, 표본 20명 미만 그룹은 공개하지 않습니다. 연령·성별에 따라 개인의 점수가 달라지지는 않습니다.</p>`;

    const draw=idx=>{
      const t=tabs[idx], el=document.getElementById('dist-box');
      if(!t.grp){ el.innerHTML='<div class="mini">해당 집단의 응답이 20명 미만이어서 공개하지 않습니다.</div>'; }
      else { el.innerHTML=distributionBars(t.grp,myType); animateDist(el); }
      box.querySelectorAll('[data-tab]').forEach((b,i)=>{
        b.classList.toggle('active',i===idx);
        b.setAttribute('aria-pressed',String(i===idx));
      });
    };
    box.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>draw(Number(btn.dataset.tab)));
    draw(0);
  }
  async function initStatistics(myType){
    const box=document.getElementById('stats-content'); if(!box) return;
    if(!statsConfigured()){
      box.innerHTML='<div class="mini"><strong>현재는 화면 시안입니다.</strong><br>실제 참여자 집계 서버가 연결되지 않았습니다. 아래 버튼으로 그래프 형태를 확인할 수 있습니다. 예시 데이터는 실제 응답이 아닙니다.</div><button id="show-demo" class="btn btn-ghost">가상 데이터로 그래프 미리보기</button>';
      document.getElementById('show-demo').onclick=()=>displayStats(demoStats(),myType,true);
      return;
    }
    try{
      const report=await postFirstChoice(myType);
      if(!document.getElementById('stats-content')) return;
      box.innerHTML=`<p class="small">${esc(report)} 참여자 통계를 불러오는 중입니다.</p>`;
      const stats=await getStats();
      if(!document.getElementById('stats-content')) return;
      displayStats(stats,myType,false);
    }catch(err){
      if(!document.getElementById('stats-content')) return;
      box.innerHTML=`<div class="mini">집계 서버 연결 상태를 확인해 주세요. ${esc(err.message||'알 수 없는 오류')}</div><button id="show-demo" class="btn btn-ghost">가상 데이터로 그래프 미리보기</button>`;
      document.getElementById('show-demo').onclick=()=>displayStats(demoStats(),myType,true);
    }
  }

  renderIntro();
  </script>
</body>
</html>
